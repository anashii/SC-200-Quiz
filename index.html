<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SC-200 Practice Quiz</title><style>body{font-family:Segoe UI,Arial;margin:0;background:linear-gradient(135deg,#eef6ff,#f6f0ff);color:#201f1e;min-height:100vh}.card{max-width:850px;margin:28px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 36px #0002}.head,.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.bar{height:9px;background:#edebe9;border-radius:9px;margin:18px 0 26px;overflow:hidden}.fill{height:100%;background:#0078d4}.ans{display:block;width:100%;padding:14px 16px;margin:10px 0;text-align:left;font-size:16px;background:#fff;border:1px solid #c8c6c4;border-radius:10px;cursor:pointer}.ok{background:#dff6dd;border:2px solid #107c10}.bad{background:#fde7e9;border:2px solid #d13438}.note{margin-top:18px;padding:12px 16px;border-left:5px solid;background:#faf9f8;border-radius:8}.btn{padding:11px 17px;border:0;border-radius:8px;background:#0078d4;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#0078d4;border:1px solid #0078d4}.end{background:#fff;color:#d13438;border:1px solid #d13438}.stats{text-align:center;color:#605e5c;font-weight:600;margin:20px 0 14px}.score{font-size:54px;font-weight:800;color:#0078d4}.btn:disabled{opacity:.45;cursor:not-allowed}@media(max-width:600px){.card{margin:0;min-height:100vh;border-radius:0;padding:20px}h2{font-size:21px}.nav .btn{flex:1}}</style></head><body><main class="card" id="app"></main><script>
const Q=[
["Which anomaly policy detects sign-ins from a country rarely used by the organization?",["Impossible travel","Anonymous IP activity","Activity from an infrequent country","Malware detection"],2,"It detects activity from a country seldom observed in the organization."],
["Which method best detects an identifier containing exactly 32 alphanumeric characters?",["SharePoint search","Advanced hunting","Azure Information Protection only","Regular expression"],3,"A regular expression can define the required fixed-length pattern."],
["How should recurring benign Defender alerts be reduced only for one department?",["Disable detection","Delete alerts","Device-group-scoped suppression rule","Disable antivirus"],2,"Scope suppression to the relevant device group to preserve protection elsewhere."],
["What turns an advanced hunting query into automatic alert generation?",["Custom detection rule","Workbook","Watchlist","Suppression rule"],0,"A custom detection rule evaluates query matches and generates alerts."],
["Which fields are important in a device-based Defender XDR custom detection?",["DeviceId and ReportId","IncidentId and AlertId","TenantId and SubscriptionId","Category and Severity"],0,"DeviceId identifies the endpoint and ReportId links source records."],
["How should Defender for Identity decoy accounts be tagged?",["Sensitive","Honeytoken","VIP","Excluded"],1,"Honeytoken accounts are decoys used to expose suspicious activity."],
["Which Safe Attachments setting delivers the message body while scanning continues?",["Dynamic Delivery","Monitor","Replace","Do not scan"],0,"Dynamic Delivery reduces delivery delay while attachment inspection continues."],
["Which indicator blocks a known malicious image file by its hash?",["URL alert only","Domain allow","File hash alert and block","Certificate audit"],2,"A file hash indicator directly targets the identified file."],
["Least privilege for approving Defender for Endpoint remediation actions?",["Security Reader plus Active remediation actions","Global Administrator","Compliance Admin plus Owner","Exchange Admin plus Contributor"],0,"Read access plus the remediation action permission is the least-privilege combination."],
["What must Defender for Cloud Apps enable to inspect files and apply file policies?",["File monitoring","Device isolation","Live response","Attack simulation"],0,"File monitoring enables cloud-file inspection and policy evaluation."],
["What distinguishes corporate offices from remote locations in Conditional Access?",["Fraud alert","Named location","Risk dismissal","Email policy"],1,"Named locations represent trusted office network ranges."],
["How should legitimate corporate public IPs be classified to reduce cloud-app anomaly noise?",["Corporate IP range","Anonymous proxy","Blocked by file policy","Remove all policies"],0,"Corporate classification adds the correct organizational context."],
["Which report helps verify a ZAP action on a delivered message?",["Threat protection status","Safe Attachments file types","Azure Activity","Device inventory"],0,"Threat protection reporting includes post-delivery email protection actions."],
["Which capability blocks risky Office child processes and executable email attachments?",["Windows Firewall","Attack surface reduction rules","Controlled folder access only","Azure Backup"],1,"ASR rules target these risky application behaviors."],
["Where should Entra diagnostic logs stream for a third-party SIEM?",["Storage only","Event Hub","Watchlist","Workbook"],1,"Event Hubs provides a streaming destination for external consumers."],
["Which Purview capability addresses mass downloads before employee departure?",["Insider Risk Management","Safe Links","Device group","Firewall policy"],0,"Insider Risk Management targets risky internal user activity."],
["Where should sensitivity-label activity be reviewed?",["Activity explorer","Incident queue","Device timeline","Mail flow"],0,"Activity explorer surfaces activity involving labeled and sensitive content."],
["Which Defender XDR incident area lists associated files, devices, users, and mailboxes?",["Evidence and response","Settings","Threat analytics only","Device inventory only"],0,"Evidence and response brings incident evidence and entities together."],
["How can selected devices be temporarily grouped for response?",["Apply a common device tag","Delete groups","Make all users Global Admin","Disable investigation"],0,"A common tag can be used to identify and group the selected devices."],
["Which KQL operator returns only matching SHA256 records from two tables?",["union","join","extend","take"],1,"join correlates datasets on a shared key."],
["What runs a playbook automatically for a high-severity incident?",["Automation rule and Logic App playbook","Workbook and watchlist","Bookmark and notebook","Connector and DCR"],0,"The automation rule evaluates conditions and invokes the playbook."],
["Which role lets a user create and edit Sentinel playbooks?",["Logic App Contributor","Sentinel Reader","Security Reader","Workbook Reader"],0,"Playbooks are Logic Apps, so Logic App Contributor is appropriate."],
["Which role lets the Azure Security Insights identity run playbooks in a resource group?",["Logic App Reader","Sentinel Automation Contributor","Sentinel Responder","Monitoring Reader"],1,"Sentinel Automation Contributor grants the service permission to run playbooks."],
["Which trigger makes a playbook available from a Sentinel incident?",["Sentinel incident trigger","Alert trigger only","HTTP polling","Recurrence"],0,"The incident trigger accepts incident objects for incident workflows."],
["Which Sentinel role manages incidents without creating analytics rules?",["Sentinel Responder","Sentinel Contributor","Owner","Logic App Contributor"],0,"Responder can manage incidents with less configuration access."],
["What must you do before customizing a workbook template?",["Clone it","Edit directly","Export incidents","Create automation"],0,"Cloning creates an editable workbook instance."],
["What must exist before ingesting custom-schema JSON with the Logs Ingestion API?",["Custom log table","Watchlist","Incident creation rule","Workbook parameter"],0,"The destination custom table and schema must exist first."],
["What lets on-premises servers appear in an AMA DCR resource picker?",["Azure Connected Machine agent","Azure File Sync","Exchange Hybrid Agent","Legacy MMA only"],0,"Azure Arc onboarding represents the servers as Azure resources."],
["Which rule type runs every minute with a one-minute lookback?",["NRT rule","Daily scheduled rule","Incident creation rule","Workbook rule"],0,"NRT rules are designed for minute-level low-latency detection."],
["How do you view active and available detections for a MITRE technique?",["Select technique and view details pane","Create hunting query","Open Cost Management","Run playbook"],0,"The technique details pane displays its coverage."],
["Which function preserves recent Timestamp and ReportId during summarize?",["arg_max()","strlen()","bin()","countif()"],0,"arg_max can retain fields from the latest row while aggregating."],
["Which columns are required for Defender XDR alert timing and source lookup?",["Timestamp and ReportId","AlertId and IncidentId","TenantId and Category","DeviceName and Severity"],0,"Timestamp drives timing and ReportId supports source lookup."],
["Which field identifies an endpoint in a device-based custom detection?",["DeviceId","WorkbookId","ResourceGroupName","IncidentNumber"],0,"DeviceId identifies the affected endpoint."],
["Which feature shows chronological activity for one endpoint?",["Device Timeline","Content hub","Activity explorer","Provisioning logs"],0,"Device Timeline shows endpoint activity in time order."],
["What collects processes, connections, scheduled tasks, and forensic artifacts?",["Investigation package","Workbook","Watchlist","Message trace"],0,"An investigation package collects a standard set of forensic artifacts."],
["How should an unfamiliar file be safely detonated?",["Submit for deep analysis","Watchlist only","Clone workbook","Dismiss alert"],0,"Deep analysis uses Microsoft's cloud sandbox."],
["What can detect or block a confirmed malicious file in future?",["File hash indicator","Workbook filter","Named location","DCR transformation"],0,"A file hash indicator applies future alert or block behavior."],
["Which action contains a compromised endpoint?",["Isolate device","Delete record","Disable rules","Archive incident"],0,"Device isolation restricts network communication."],
["Which action forces a compromised user to establish strong authentication again?",["Require MFA re-registration","Dismiss risk","Add watchlist","Clone workbook"],0,"MFA re-registration requires the authentication methods to be established again."],
["Which Defender for Identity report tracks changes to sensitive groups?",["Modifications to sensitive groups","Device health","Threat protection status","Cloud Discovery"],0,"The report focuses on changes to sensitive groups."],
["Which Entra report investigates accounts currently considered risky?",["Risky users","Provisioning logs","Workbook gallery","Device inventory"],0,"Risky users lists user-risk detections and status."],
["What enables embedded Security Copilot capabilities in Defender XDR?",["Defender XDR plugin","Watchlist","Azure Arc","Workbook"],0,"The plugin lets Security Copilot invoke Defender XDR capabilities."],
["Which source investigates sign-in and OneDrive sharing activity?",["Purview Audit","Device Timeline","Azure Activity only","Watchlist"],0,"Purview Audit records Microsoft 365 user and workload activity."],
["Which Graph activity field correlates API activity to the issuing sign-in?",["SignInActivityId","OperationId","ClientRequestId","ResponseStatusCode"],0,"SignInActivityId links Graph requests to sign-in context."],
["Which Graph filter finds authorization failures?",["Status 401 or 403","Status 200","ResultType 0","Status 429 only"],0,"HTTP 401 and 403 indicate authentication or authorization failure."],
["Which operator searches one IP across rows from several tables?",["union","join","extend","project-away"],0,"union appends table rows before a common filter is applied."],
["Which table stores UEBA behavior titles and descriptions?",["BehaviorInfo","BehaviorEntities","DeviceInfo","IdentityLogonEvents"],0,"BehaviorInfo contains behavior metadata."],
["How can short username and UPN resolve to one Sentinel Graph node?",["Sync user entities with Entra ID","Create two incidents","Disable mapping","Use workbook"],0,"Entra synchronization supports identity resolution across identifiers."],
["What enables Sentinel Graph blast-radius analysis?",["Sentinel data lake","Email connector only","Workbook clone","Suppression rule"],0,"Blast-radius analysis depends on Sentinel data lake graph infrastructure."],
["How do you target one workspace with the Sentinel MCP server?",["List workspaces and specify workspace ID","Use tenant ID","Reinstall VS Code","Use default"],0,"Explicitly specify the intended workspace ID." ]
];
let order=[],pos=0,ans={}; const app=document.getElementById('app');
function shuffle(){order=Q.map((_,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
function score(){return Object.entries(ans).filter(([k,v])=>Q[+k][2]===v).length}
function render(){let qi=order[pos],q=Q[qi],chosen=ans[qi],answered=Object.keys(ans).length;app.innerHTML=`<div class="head"><b>SC-200 Practice Test</b><span>Question ${pos+1} of ${Q.length}</span></div><div class="bar"><div class="fill" style="width:${(pos+1)/Q.length*100}%"></div></div><h2>${q[0]}</h2><div id="answers"></div><div id="feedback"></div><div class="stats">${answered} answered · ${score()} correct</div><div class="nav"><button class="btn secondary" id="prev" ${pos===0?'disabled':''}>Previous</button><button class="btn end" id="end">End quiz</button><button class="btn" id="next" ${chosen===undefined?'disabled':''}>${pos===Q.length-1?'Finish':'Next'}</button></div>`;let box=document.getElementById('answers');q[1].forEach((t,i)=>{let b=document.createElement('button');b.className='ans'+(chosen!==undefined&&i===q[2]?' ok':'')+(chosen!==undefined&&i===chosen&&i!==q[2]?' bad':'');b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${t}`;b.onclick=()=>{if(ans[qi]===undefined){ans[qi]=i;render()}};box.appendChild(b)});if(chosen!==undefined){document.getElementById('feedback').innerHTML=`<div class="note" style="border-color:${chosen===q[2]?'#107c10':'#d13438'}"><b>${chosen===q[2]?'Correct':'Incorrect'}</b>${chosen!==q[2]?`<p><b>Correct answer:</b> ${String.fromCharCode(65+q[2])}. ${q[1][q[2]]}</p>`:''}<p>${q[3]}</p></div>`}document.getElementById('prev').onclick=()=>{pos--;render()};document.getElementById('end').onclick=end;document.getElementById('next').onclick=()=>{if(pos===Q.length-1)end();else{pos++;render()}}}
function end(){let n=Object.keys(ans).length,s=score(),p=n?Math.round(s/n*100):0;app.innerHTML=`<h1>Quiz results</h1><div class="score">${s}/${n}</div><p>${n?`You answered ${n} questions and got ${s} correct (${p}%).`:'You ended the quiz without answering a question.'}</p><button class="btn" id="restart">Start new shuffled quiz</button>`;document.getElementById('restart').onclick=start}
function start(){ans={};pos=0;shuffle();render()} start();
</script></body></html>
